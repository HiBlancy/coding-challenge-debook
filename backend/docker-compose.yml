services:
  db:
    image: postgres:16-alpine
    container_name: debook_challenge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: debook
      POSTGRES_PASSWORD: debook
      POSTGRES_DB: debook
    ports:
      - '5432:5432'
    volumes:
      - debook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U debook']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  debook_pgdata:
